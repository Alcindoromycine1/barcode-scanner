
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barcode Tracker</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 16px;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #202124;
      background: #f4f6f8;
    }

    h2 {
      margin-bottom: 8px;
    }

    #reader {
      margin: 20px auto;
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      background: #1967d2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #5f6368;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      padding: 16px;
      border-radius: 10px;
      background: white;
      border: 1px solid #dadce0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    /* Red warning for previously scanned barcodes. */
    #status.warning {
      color: #b3261e;
      border: 1px solid #d93025;
      background: #fce8e6;
      font-weight: bold;
    }

    /* Green status for successful scans. */
    #status.success {
      color: #137333;
      border: 1px solid #34a853;
      background: #e6f4ea;
    }

    /* Neutral status for loading and information. */
    #status.info {
      color: #202124;
      border: 1px solid #dadce0;
      background: white;
    }

    #manual {
      margin-top: 20px;
      padding: 14px;
      background: white;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }

    .hint {
      color: #5f6368;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h2>Barcode Tracker</h2>

  <p>
    Press the button to scan one barcode and update Google Sheets.
  </p>

  <div id="reader"></div>

  <button id="scan" type="button">
    Scan Barcode
  </button>

  <div id="status" class="info" role="status" aria-live="polite">
    Ready. Press Scan Barcode to activate the camera.
  </div>

  <div id="manual">
    <strong>Manual barcode entry</strong>

    <input
      id="barcode"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Enter barcode number"
    >

    <button id="submit" type="button">
      Find and mark scanned
    </button>

    <p class="hint">
      Use this if the camera is unavailable.
    </p>
  </div>

  <script>
    // Your deployed Google Apps Script web app URL.
    const API_URL =
      'https://script.google.com/a/macros/tdsb.ca/s/AKfycbz7VEYQed8nI0iaB4HpCQmGDWQA7CHawQtOUFCD37beJfS9VLc0OoN4KiEFxwn4aBTL/exec';

    let scanner = null;
    let scanning = false;
    let busy = false;
    let scanHandled = false;

    const scanButton = document.getElementById('scan');
    const submitButton = document.getElementById('submit');
    const barcodeInput = document.getElementById('barcode');

    function status(message, type = 'info') {
      const el = document.getElementById('status');

      // Use textContent so barcode values are displayed as text.
      el.textContent = message;
      el.classList.remove('warning', 'success', 'info');
      el.classList.add(type);
    }

    async function stopCamera() {
      const currentScanner = scanner;

      scanner = null;
      scanning = false;

      if (!currentScanner) return;

      try {
        if (currentScanner.isScanning) {
          await currentScanner.stop();
        }
      } catch (error) {
        console.warn('Camera stop error:', error);
      }

      try {
        await currentScanner.clear();
      } catch (error) {
        console.warn('Scanner cleanup error:', error);
      }
    }

    async function startScanner() {
      if (scanning || busy) return;

      if (
        !window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia
      ) {
        status(
          'Camera access requires HTTPS and a supported browser.',
          'warning'
        );
        return;
      }

      if (typeof Html5Qrcode === 'undefined') {
        status(
          'Scanner library failed to load. Check your internet connection.',
          'warning'
        );
        return;
      }

      scanHandled = false;
      scanning = true;

      scanButton.disabled = true;
      submitButton.disabled = true;

      status('Starting camera...', 'info');

      try {
        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: {
              width: 280,
              height: 140
            },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.ITF,
              Html5QrcodeSupportedFormats.CODABAR
            ]
          },

          async function(decodedText) {
            if (scanHandled || !scanning || busy) return;

            // Only accept one successful barcode read per button press.
            scanHandled = true;
            scanning = false;

            const code = String(decodedText).trim();

            // Turn off the camera before contacting Google Sheets.
            await stopCamera();

            status(
              'Barcode detected: ' + code +
              '\nUpdating Google Sheets...',
              'info'
            );

            sendBarcode(code);
          },

          function() {
            // Ignore frames where no barcode is detected.
          }
        );

        status(
          'Camera ready. Point it at one barcode.',
          'info'
        );

      } catch (error) {
        console.error('Camera error:', error);

        await stopCamera();

        scanButton.disabled = false;
        submitButton.disabled = false;

        status(
          'Camera could not start:\n' + error.message,
          'warning'
        );
      }
    }

    function sendBarcode(rawCode) {
      const code = String(rawCode || '').trim();

      if (!code) {
        status('Enter or scan a barcode first.', 'warning');
        scanButton.disabled = false;
        submitButton.disabled = false;
        return;
      }

      if (busy) return;

      let parsedApiUrl;

      try {
        parsedApiUrl = new URL(API_URL);
      } catch (error) {
        status('The Apps Script URL is invalid.', 'warning');
        scanButton.disabled = false;
        submitButton.disabled = false;
        return;
      }

      if (
        parsedApiUrl.protocol !== 'https:' ||
        parsedApiUrl.hostname !== 'script.google.com' ||
        !parsedApiUrl.pathname.endsWith('/exec')
      ) {
        status(
          'Use a valid deployed Apps Script URL ending in /exec.',
          'warning'
        );
        scanButton.disabled = false;
        submitButton.disabled = false;
        return;
      }

      busy = true;

      scanButton.disabled = true;
      submitButton.disabled = true;

      status('Looking up barcode: ' + code + ' ...', 'info');

      const callback =
        'barcodeCallback_' +
        Date.now() + '_' +
        Math.floor(Math.random() * 1000000);

      const script = document.createElement('script');

      let finished = false;

      const timeout = setTimeout(function() {
        finish();

        status(
          'No response from Google Sheets.\n' +
          'Check your /exec URL, deployment access, and internet connection.',
          'warning'
        );
      }, 20000);

      function finish() {
        if (finished) return;

        finished = true;

        clearTimeout(timeout);
        delete window[callback];
        script.remove();

        busy = false;

        scanButton.disabled = false;
        submitButton.disabled = false;
      }

      window[callback] = function(result) {
        finish();

        if (result && result.alreadyScanned) {
          // Show the duplicate barcode warning in red.
          status(
            '⚠ ' + code + ' already scanned.',
            'warning'
          );

        } else if (result && result.success) {
          status(
            '✓ ' + result.message +
            '\n\nReady for the next barcode.',
            'success'
          );

        } else {
          status(
            '⚠ ' +
            ((result && result.message) ||
              'Unexpected response from server.'),
            'warning'
          );
        }
      };

      script.onerror = function() {
        finish();

        status(
          'Could not contact Google Apps Script.\n' +
          'Check the /exec URL and deployment permissions.',
          'warning'
        );
      };

      const url = new URL(API_URL);

      url.searchParams.set('action', 'scan');
      url.searchParams.set('barcode', code);
      url.searchParams.set('callback', callback);
      url.searchParams.set('_', String(Date.now()));

      script.src = url.toString();
      document.body.appendChild(script);
    }

    // Camera starts only when this button is pressed.
    scanButton.addEventListener('click', startScanner);

    // Manual barcode entry.
    submitButton.addEventListener('click', function() {
      sendBarcode(barcodeInput.value);
    });

    barcodeInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendBarcode(this.value);
      }
    });
  </script>
</body>
</html>
