<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Barcode Registration & Lunch Tracker</title>
  
  <!-- html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .mode-indicator {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mode-none { background-color: #e2e8f0; color: #475569; }
    .mode-register { background-color: #dbeafe; color: #1e40af; }
    .mode-lunch { background-color: #fef3c7; color: #92400e; }

    /* Home View */
    .menu-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-warning { background: var(--warning); color: white; }
    .btn-warning:hover { background: #b45309; }

    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #b91c1c; }

    .btn-secondary { background: #64748b; color: white; }
    .btn-secondary:hover { background: #475569; }

    /* Scanner View */
    #scanner-section {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .scanner-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    #reader video {
      object-fit: cover;
    }

    /* Manual Input Form */
    .manual-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .manual-form input {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .manual-form input:focus {
      border-color: var(--primary);
    }

    .manual-form button {
      padding: 12px 20px;
      white-space: nowrap;
    }

    /* Feedback Banner */
    .status-msg {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
      text-align: center;
    }

    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-warning { background: #fef3c7; color: #b45309; }
    .status-error { background: #fee2e2; color: #b91c1c; }

    /* Modal / Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: modalSlide 0.2s ease-out;
    }

    @keyframes modalSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header h2 {
      font-size: 1.3rem;
      color: var(--text);
    }

    .modal-header p {
      font-size: 0.875rem;
      color: #64748b;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .data-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .data-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.05em;
    }

    .data-value {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Event Scanner</h1>
      <span id="mode-badge" class="mode-indicator mode-none">Select Mode</span>
    </header>

    <!-- STATUS MESSAGES -->
    <div id="status-box" class="status-msg"></div>

    <!-- MAIN MENU -->
    <div id="menu-section" class="menu-card">
      <button class="btn btn-primary" onclick="startSession('register')">
        📷 Event Registration
      </button>
      <button class="btn btn-warning" onclick="startSession('lunch')">
        🍱 Lunch Distribution
      </button>
    </div>

    <!-- SCANNER SECTION -->
    <div id="scanner-section">
      <div class="scanner-card">
        <div id="reader"></div>

        <form class="manual-form" onsubmit="handleManualSubmit(event)">
          <input type="text" id="manual-input" placeholder="Enter barcode manually..." autocomplete="off" />
          <button type="submit" class="btn btn-secondary">Submit</button>
        </form>
      </div>

      <button class="btn btn-danger" onclick="stopSession()">Stop Scanning</button>
    </div>
  </div>

  <!-- PARTICIPANT POPUP MODAL -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Participant Found</h2>
        <p id="modal-barcode-display">ID: ---</p>
      </div>

      <div class="modal-body">
        <div class="data-row">
          <span class="data-label">Full Name</span>
          <span class="data-value" id="person-name">---</span>
        </div>
        <div class="data-row">
          <span class="data-label">Organization / School</span>
          <span class="data-value" id="person-school">---</span>
        </div>
        <div class="data-row">
          <span class="data-label" id="dynamic-label">Consent / Restrictions</span>
          <span class="data-value" id="dynamic-value">---</span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal(true)">Cancel</button>
        <button id="confirm-btn" class="btn btn-primary" onclick="confirmAction()">
          Confirm
        </button>
      </div>
    </div>
  </div>
