<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Barcode Registration & Lunch Tracker</title>
  
  <!-- html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .mode-indicator {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mode-none { background-color: #e2e8f0; color: #475569; }
    .mode-register { background-color: #dbeafe; color: #1e40af; }
    .mode-lunch { background-color: #fef3c7; color: #92400e; }

    /* Home View */
    .menu-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-warning { background: var(--warning); color: white; }
    .btn-warning:hover { background: #b45309; }

    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #b91c1c; }

    .btn-secondary { background: #64748b; color: white; }
    .btn-secondary:hover { background: #475569; }

    /* Scanner View */
    #scanner-section {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .scanner-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    #reader video {
      object-fit: cover;
    }

    /* Manual Input Form */
    .manual-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .manual-form input {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .manual-form input:focus {
      border-color: var(--primary);
    }

    .manual-form button {
      padding: 12px 20px;
      white-space: nowrap;
    }

    /* Feedback Banner */
    .status-msg {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
      text-align: center;
    }

    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-warning { background: #fef3c7; color: #b45309; }
    .status-error { background: #fee2e2; color: #b91c1c; }

    /* Modal / Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: modalSlide 0.2s ease-out;
    }

    @keyframes modalSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header h2 {
      font-size: 1.3rem;
      color: var(--text);
    }

    .modal-header p {
      font-size: 0.875rem;
      color: #64748b;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .data-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .data-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.05em;
    }

    .data-value {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Event Scanner</h1>
      <span id="mode-badge" class="mode-indicator mode-none">Select Mode</span>
    </header>

    <!-- STATUS MESSAGES -->
    <div id="status-box" class="status-msg"></div>

    <!-- MAIN MENU -->
    <div id="menu-section" class="menu-card">
      <button class="btn btn-primary" onclick="startSession('register')">
        📷 Event Registration
      </button>
      <button class="btn btn-warning" onclick="startSession('lunch')">
        🍱 Lunch Distribution
      </button>
    </div>

    <!-- SCANNER SECTION -->
    <div id="scanner-section">
      <div class="scanner-card">
        <div id="reader"></div>

        <form class="manual-form" onsubmit="handleManualSubmit(event)">
          <input type="text" id="manual-input" placeholder="Enter barcode manually..." autocomplete="off" />
          <button type="submit" class="btn btn-secondary">Submit</button>
        </form>
      </div>

      <button class="btn btn-danger" onclick="stopSession()">Stop Scanning</button>
    </div>
  </div>

  <!-- PARTICIPANT POPUP MODAL -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Participant Found</h2>
        <p id="modal-barcode-display">ID: ---</p>
      </div>

      <div class="modal-body">
        <div class="data-row">
          <span class="data-label">Full Name</span>
          <span class="data-value" id="person-name">---</span>
        </div>
        <div class="data-row">
          <span class="data-label">Organization / School</span>
          <span class="data-value" id="person-school">---</span>
        </div>
        <div class="data-row">
          <span class="data-label" id="dynamic-label">Consent / Restrictions</span>
          <span class="data-value" id="dynamic-value">---</span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal(true)">Cancel</button>
        <button id="confirm-btn" class="btn btn-primary" onclick="confirmAction()">
          Confirm
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const API_URL = 'https://script.google.com/macros/s/AKfycbyB2RxhQoq0e0t2bei-vftDk4SElsCZ-zLNlL6oRWGd-inkzfiUrDnnsNL56MNzPupkpw/exec';
    
    // Supported barcode formats
    const FORMATS = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.CODABAR
    ];

    // --- GLOBAL STATE ---
    let html5QrcodeScanner = null;
    let currentMode = null; // 'register' or 'lunch'
    let isProcessing = false;
    let isScanningActive = false;
    let currentParticipant = null;

    // --- UI ELEMENTS ---
    const menuSection = document.getElementById('menu-section');
    const scannerSection = document.getElementById('scanner-section');
    const modeBadge = document.getElementById('mode-badge');
    const statusBox = document.getElementById('status-box');
    const modalOverlay = document.getElementById('modal-overlay');

    // --- JSONP HELPER ---
    function makeJsonpRequest(action, barcode) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.random().toString(36).substring(2, 11);
        const script = document.createElement('script');

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Request timed out. Please check your network connection.'));
        }, 12000);

        function cleanup() {
          if (timeout) clearTimeout(timeout);
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[callbackName];
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        const params = new URLSearchParams({
          action: action,
          barcode: barcode,
          callback: callbackName
        });

        script.src = `${API_URL}?${params.toString()}`;
        script.onerror = function() {
          cleanup();
          reject(new Error('Network error or invalid server response.'));
        };

        document.body.appendChild(script);
      });
    }

    // --- STATUS DISPLAY ---
    function showStatus(text, type = 'info', autoHideMs = 4000) {
      statusBox.className = `status-msg status-${type}`;
      statusBox.textContent = text;
      statusBox.style.display = 'block';

      if (autoHideMs > 0) {
        setTimeout(() => {
          if (statusBox.textContent === text) {
            statusBox.style.display = 'none';
          }
        }, autoHideMs);
      }
    }

    // --- SESSION MANAGEMENT ---
    async function startSession(mode) {
      currentMode = mode;
      isScanningActive = true;

      // Update Header Badge
      modeBadge.textContent = mode === 'register' ? 'Registration Mode' : 'Lunch Tracker Mode';
      modeBadge.className = `mode-indicator ${mode === 'register' ? 'mode-register' : 'mode-lunch'}`;

      // Toggle Views
      menuSection.style.display = 'none';
      scannerSection.style.display = 'flex';
      showStatus(`Camera starting for ${mode}...`, 'info');

      try {
        if (!html5QrcodeScanner) {
          html5QrcodeScanner = new Html5Qrcode("reader", { formatsToSupport: FORMATS });
        }

        const config = {
          fps: 10,
          qrbox: { width: 250, height: 150 },
          aspectRatio: 1.0
        };

        await html5QrcodeScanner.start(
          { facingMode: "environment" },
          config,
          onBarcodeScanned,
          () => {} // Ignore scan errors per frame
        );

        showStatus(`Ready to scan for ${mode}.`, 'info');
      } catch (err) {
        console.error('Camera launch error:', err);
        showStatus('Failed to access camera. You can still use manual entry below.', 'error', 0);
      }
    }

    async function stopSession() {
      isScanningActive = false;
      closeModal(false);

      if (html5QrcodeScanner) {
        try {
          const state = html5QrcodeScanner.getState();
          if (state === Html5QrcodeScannerState.SCANNING || state === Html5QrcodeScannerState.PAUSED) {
            await html5QrcodeScanner.stop();
          }
        } catch (e) {
          console.warn('Error stopping scanner:', e);
        }
      }

      currentMode = null;
      isProcessing = false;

      // Reset UI
      modeBadge.textContent = 'Select Mode';
      modeBadge.className = 'mode-indicator mode-none';
      scannerSection.style.display = 'none';
      menuSection.style.display = 'flex';
      showStatus('Scanning session ended.', 'info');
    }

    // --- SCANNER CALLBACK ---
    async function onBarcodeScanned(decodedText) {
      if (isProcessing || !isScanningActive) return;
      isProcessing = true;

      // Pause camera during processing
      try {
        if (html5QrcodeScanner && html5QrcodeScanner.getState() === Html5QrcodeScannerState.SCANNING) {
          await html5QrcodeScanner.pause(true);
        }
      } catch (e) {
        console.warn('Unable to pause camera:', e);
      }

      await processBarcode(decodedText.trim());
    }

    function handleManualSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('manual-input');
      const val = input.value.trim();
      if (!val || isProcessing) return;

      isProcessing = true;
      input.value = '';

      // Pause camera if running
      try {
        if (html5QrcodeScanner && html5QrcodeScanner.getState() === Html5QrcodeScannerState.SCANNING) {
          html5QrcodeScanner.pause(true);
        }
      } catch (e) {}

      processBarcode(val);
    }

    // --- CORE WORKFLOW ---
    async function processBarcode(barcode) {
      showStatus(`Looking up barcode ${barcode}...`, 'info', 0);

      try {
        const response = await makeJsonpRequest('lookup', barcode);

        if (!response.success) {
          showStatus(response.message || `Barcode ${barcode} not found.`, 'error', 5000);
          await resumeCamera();
          return;
        }

        // Check for prior completion per requested operation
        if (currentMode === 'register' && response.checkedIn) {
          showStatus(`⚠️ ${response.first} ${response.last} is ALREADY registered!`, 'warning', 5000);
          await resumeCamera();
          return;
        }

        if (currentMode === 'lunch' && response.lunchLogged) {
          showStatus(`⚠️ Lunch has ALREADY been logged for ${response.first} ${response.last}!`, 'warning', 5000);
          await resumeCamera();
          return;
        }

        // Save state and construct popup
        currentParticipant = response;
        openModal(response);

      } catch (err) {
        console.error('Lookup failed:', err);
        showStatus('Network error during lookup. Please try again.', 'error', 5000);
        await resumeCamera();
      }
    }

    // --- MODAL / POPUP INTERACTION ---
    function openModal(data) {
      document.getElementById('modal-barcode-display').textContent = `ID: ${data.barcode}`;
      document.getElementById('person-name').textContent = `${data.first} ${data.last}`;
      document.getElementById('person-school').textContent = data.school || 'N/A';

      const confirmBtn = document.getElementById('confirm-btn');

      if (currentMode === 'register') {
        document.getElementById('modal-title').textContent = 'Confirm Registration';
        document.getElementById('dynamic-label').textContent = 'Media Consent';
        document.getElementById('dynamic-value').textContent = data.mediaConsent || 'N/A';
        
        confirmBtn.textContent = 'Register';
        confirmBtn.className = 'btn btn-primary';
      } else {
        document.getElementById('modal-title').textContent = 'Confirm Lunch Logging';
        document.getElementById('dynamic-label').textContent = 'Dietary Restrictions';
        document.getElementById('dynamic-value').textContent = data.dietaryRestrictions || 'None';
        
        confirmBtn.textContent = 'Log';
        confirmBtn.className = 'btn btn-warning';
      }

      confirmBtn.disabled = false;
      modalOverlay.style.display = 'flex';
    }

    function closeModal(shouldResumeCamera = true) {
      modalOverlay.style.display = 'none';
      currentParticipant = null;
      if (shouldResumeCamera) {
        resumeCamera();
      }
    }

    async function confirmAction() {
      if (!currentParticipant || !currentMode) return;

      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<span class="spinner"></span> Saving...';

      const actionTarget = currentMode; // 'register' or 'lunch'
      const barcode = currentParticipant.barcode;

      try {
        const response = await makeJsonpRequest(actionTarget, barcode);

        if (response.success) {
          const modeLabel = currentMode === 'register' ? 'Registered' : 'Lunch Logged';
          showStatus(`✅ ${currentParticipant.first} ${currentParticipant.last} - ${modeLabel} successfully!`, 'success', 4000);
          modalOverlay.style.display = 'none';
          currentParticipant = null;
          await resumeCamera();
        } else if (response.alreadyDone) {
          showStatus(`⚠️ ${response.message}`, 'warning', 5000);
          modalOverlay.style.display = 'none';
          currentParticipant = null;
          await resumeCamera();
        } else {
          showStatus(`❌ Update failed: ${response.message}`, 'error', 5000);
          confirmBtn.disabled = false;
          confirmBtn.textContent = currentMode === 'register' ? 'Register' : 'Log';
        }
      } catch (err) {
        console.error('Update request error:', err);
        showStatus('Network error while updating record. Try again.', 'error', 5000);
        confirmBtn.disabled = false;
        confirmBtn.textContent = currentMode === 'register' ? 'Register' : 'Log';
      }
    }

    // --- HELPER TO RESUME SCANNING ---
    async function resumeCamera() {
      isProcessing = false;
      if (!isScanningActive) return;

      try {
        if (html5QrcodeScanner && html5QrcodeScanner.getState() === Html5QrcodeScannerState.PAUSED) {
          await html5QrcodeScanner.resume();
        }
      } catch (e) {
        console.warn('Camera resume error:', e);
      }
    }
  </script>
</body>
</html>
